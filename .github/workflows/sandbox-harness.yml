name: sandbox-harness

on:
  push:
    paths:
      - "apps/sandbox-harness/**"
      - "agents/coder.factory.json"
      - ".github/workflows/sandbox-harness.yml"
  pull_request:
    paths:
      - "apps/sandbox-harness/**"
      - "agents/coder.factory.json"
      - ".github/workflows/sandbox-harness.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/sandbox-harness/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
