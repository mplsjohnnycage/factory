# Meta Developer OS CI (PBI-008 landed). Meaningful check name + push limited
# to main so PR branches do not double-run push+pull_request.
name: developer-os

on:
  push:
    branches: [main]
    paths:
      - "apps/developer-os/**"
      - "specs/developer-os/**"
      - ".github/workflows/developer-os.yml"
  pull_request:
    paths:
      - "apps/developer-os/**"
      - "specs/developer-os/**"
      - ".github/workflows/developer-os.yml"

concurrency:
  group: developer-os-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  developer-os-typecheck-test-build:
    name: developer-os-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/developer-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/developer-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
