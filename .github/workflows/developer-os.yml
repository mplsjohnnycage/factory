name: developer-os

on:
  push:
    paths:
      - "apps/developer-os/**"
      - "specs/developer-os/**"
      - ".github/workflows/developer-os.yml"
  pull_request:
    paths:
      - "apps/developer-os/**"
      - "specs/developer-os/**"
      - ".github/workflows/developer-os.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/developer-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/developer-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
