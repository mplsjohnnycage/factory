name: factory-gateway

on:
  push:
    paths:
      - "apps/factory-gateway/**"
      - ".github/workflows/factory-gateway.yml"
  pull_request:
    paths:
      - "apps/factory-gateway/**"
      - ".github/workflows/factory-gateway.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/factory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/factory-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
