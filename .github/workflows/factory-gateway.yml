name: factory-gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/factory-gateway/**"
      - ".github/workflows/factory-gateway.yml"
  pull_request:
    paths:
      - "apps/factory-gateway/**"
      - ".github/workflows/factory-gateway.yml"

concurrency:
  group: factory-gateway-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway-typecheck-test:
    name: gateway-typecheck-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/factory-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/factory-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
