# Approved idea -> linked PBI-draft issue (idempotent). Idea = issue labeled `idea`;
# approving = adding label `approved`. Port can also push `factory_idea_approved`.
name: idea-to-issue

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [factory_idea_approved]

permissions:
  contents: read
  issues: write

jobs:
  create:
    name: idea-to-issue
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.label.name == 'approved' &&
       contains(github.event.issue.labels.*.name, 'idea'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create linked issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDEA_JSON: ${{ toJSON(github.event_name == 'issues' && github.event.issue || github.event.client_payload) }}
        run: node scripts/idea-to-issue.mjs
